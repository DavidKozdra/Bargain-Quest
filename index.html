<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link id="appFavicon" rel="icon" type="image/png" href="logo.png">

  <style>
    :root {
      --app-vw: 100vw;
      --app-vh: 100vh;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #08111a;
    }

    #startupShell {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(16px, env(safe-area-inset-top, 0px))
        max(16px, env(safe-area-inset-right, 0px))
        max(16px, env(safe-area-inset-bottom, 0px))
        max(16px, env(safe-area-inset-left, 0px));
      box-sizing: border-box;
      overflow-y: auto;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(202, 163, 80, 0.12) 0%, transparent 48%),
        radial-gradient(ellipse at 80% 90%, rgba(80, 50, 20, 0.16) 0%, transparent 42%),
        linear-gradient(180deg, #0d0b14 0%, #151220 50%, #1a1525 100%);
      color: #f4ead1;
      font-family: var(--font-main, Georgia, serif);
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #startupShell.startup-shell-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .startup-shell-card {
      position: relative;
      width: min(420px, 100%);
      padding: 28px 24px;
      overflow: hidden;
      border: 2px solid var(--accent, #caa350);
      border-radius: 16px;
      background: linear-gradient(180deg, #0d0b14 0%, #151220 50%, #1a1525 100%);
      box-shadow: 0 0 40px rgba(0,0,0,0.7), inset 0 0 60px rgba(0,0,0,0.3);
      text-align: center;
      max-height: calc(var(--app-vh, 100dvh) - 48px);
      overflow-y: auto;
      box-sizing: border-box;
    }

    .startup-shell-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(202,163,80,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(80,50,20,0.15) 0%, transparent 40%);
      pointer-events: none;
    }

    .startup-shell-logo {
      display: block;
      width: min(240px, 72vw);
      height: auto;
      margin: 0 auto 14px;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 24px rgba(202, 163, 80, 0.25));
      position: relative;
      z-index: 1;
    }

    .startup-shell-mark {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(202, 163, 80, 0.14);
      color: var(--accent-hover, #e8c860);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    .startup-shell-title {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: 0.08em;
      font-family: var(--font-heading, Georgia, serif);
      color: var(--accent, #caa350);
      text-shadow: 1px 1px 2px #000;
      position: relative;
      z-index: 1;
    }

    .startup-shell-subtitle {
      margin: 8px 0 18px;
      color: rgba(232, 200, 96, 0.9);
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    .startup-shell-status {
      margin: 0;
      color: rgba(244, 234, 209, 0.9);
      font-size: 15px;
      position: relative;
      z-index: 1;
    }

    .startup-shell-bar {
      margin-top: 18px;
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      position: relative;
      z-index: 1;
    }

    .startup-shell-bar::before {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent, #caa350) 0%, var(--accent-hover, #e8c860) 100%);
      animation: startup-shell-scan 1.1s ease-in-out infinite;
    }

    @media (max-width: 700px), (max-height: 760px) {
      #startupShell {
        align-items: flex-start;
        padding:
          max(12px, calc(env(safe-area-inset-top, 0px) + 8px))
          max(12px, env(safe-area-inset-right, 0px))
          max(12px, calc(env(safe-area-inset-bottom, 0px) + 8px))
          max(12px, env(safe-area-inset-left, 0px));
      }

      .startup-shell-card {
        width: min(100%, 360px);
        padding: 22px 16px 18px;
        max-height: calc(var(--app-vh, 100dvh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 24px);
      }

      .startup-shell-logo {
        width: min(220px, 72vw);
        margin-bottom: 10px;
      }

      .startup-shell-mark {
        margin-bottom: 10px;
      }

      .startup-shell-subtitle {
        margin-bottom: 14px;
        font-size: 13px;
      }

      .startup-shell-status {
        font-size: 14px;
      }
    }

    @media (max-width: 480px), (max-height: 620px) {
      .startup-shell-card {
        width: min(100%, 320px);
        padding: 16px 14px 14px;
        border-radius: 14px;
      }

      .startup-shell-logo {
        width: min(168px, 56vw);
        margin-bottom: 8px;
      }

      .startup-shell-mark {
        font-size: 11px;
        letter-spacing: 0.12em;
        margin-bottom: 8px;
      }

      .startup-shell-title {
        font-size: clamp(24px, 8vw, 34px);
      }

      .startup-shell-subtitle {
        margin: 6px 0 10px;
        font-size: 11px;
        letter-spacing: 0.1em;
      }

      .startup-shell-status {
        font-size: 13px;
      }

      .startup-shell-bar {
        margin-top: 12px;
        height: 6px;
      }
    }

    @keyframes startup-shell-scan {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(260%); }
    }
  </style>
  <script>
    (function ensureFavicon() {
      const pngHref = "logo.png";
      const fallbackSvg =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111a24'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' font-size='34' font-family='Arial' fill='%23d4af37'%3EBQ%3C/text%3E%3C/svg%3E";

      function setIcon(href, type) {
        let link = document.getElementById("appFavicon");
        if (!link) {
          link = document.createElement("link");
          link.id = "appFavicon";
          link.rel = "icon";
          document.head.appendChild(link);
        }
        link.type = type;
        link.href = href;
      }

      const probe = new Image();
      probe.onload = function () { setIcon(pngHref, "image/png"); };
      probe.onerror = function () { setIcon(fallbackSvg, "image/svg+xml"); };
      probe.src = pngHref;
    })();
  </script>
  <script>
    (function initViewportMetrics() {
      const root = document.documentElement;
      let rafId = 0;

      function read() {
        const vv = typeof window !== "undefined" ? window.visualViewport : null;
        const rawWidth = (vv && Number.isFinite(vv.width) && vv.width > 0)
          ? vv.width
          : (typeof window !== "undefined" && Number.isFinite(window.innerWidth) && window.innerWidth > 0)
            ? window.innerWidth
            : root.clientWidth || 1280;
        const rawHeight = (vv && Number.isFinite(vv.height) && vv.height > 0)
          ? vv.height
          : (typeof window !== "undefined" && Number.isFinite(window.innerHeight) && window.innerHeight > 0)
            ? window.innerHeight
            : root.clientHeight || 720;

        return {
          width: Math.max(1, Math.round(rawWidth)),
          height: Math.max(1, Math.round(rawHeight)),
        };
      }

      function sync() {
        const next = read();
        root.style.setProperty("--app-vw", `${next.width}px`);
        root.style.setProperty("--app-vh", `${next.height}px`);
        return next;
      }

      function scheduleSync() {
        if (rafId) return;
        rafId = window.requestAnimationFrame(() => {
          rafId = 0;
          sync();
        });
      }

      window.BQViewport = {
        read,
        sync,
        scheduleSync,
      };

      sync();
      window.addEventListener("resize", scheduleSync, { passive: true });
      window.addEventListener("orientationchange", scheduleSync, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleSync, { passive: true });
        window.visualViewport.addEventListener("scroll", scheduleSync, { passive: true });
      }
      document.addEventListener("DOMContentLoaded", scheduleSync, { once: true });
    })();
  </script>
</head>
<body>
  <!-- Hidden SVG colorblind simulation filters -->
  <svg id="bq-svg-filters" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <!-- Deuteranopia (red-green, green-weak) -->
      <filter id="svg-deut-filter" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/>
      </filter>
      <!-- Protanopia (red-green, red-weak) -->
      <filter id="svg-prot-filter" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0"/>
      </filter>
    </defs>
  </svg>
  <div id="startupShell" aria-live="polite">
    <div class="startup-shell-card">
      <img
        class="startup-shell-logo"
        src="./assets/images/bargain quest logo.gif"
        alt="Bargain Quest logo"
      >
      <div class="startup-shell-mark">Loading</div>
      <h1 class="startup-shell-title">Bargain Quest</h1>
      <p class="startup-shell-subtitle">Sales and Sails</p>
      <p class="startup-shell-status" id="startupShellStage">Loading engine...</p>
      <div class="startup-shell-bar" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    (function initStartupShellApi() {
      function getShell() {
        return document.getElementById("startupShell");
      }

      function getStageEl() {
        return document.getElementById("startupShellStage");
      }

      window.BQStartupShell = {
        setStage(message) {
          const el = getStageEl();
          if (el && typeof message === "string" && message.trim()) {
            el.textContent = message;
          }
        },
        hide() {
          const shell = getShell();
          if (!shell || shell.dataset.hidden === "1") return;
          shell.dataset.hidden = "1";
          shell.classList.add("startup-shell-hidden");
          window.setTimeout(() => {
            shell.remove();
          }, 260);
        },
        isVisible() {
          const shell = getShell();
          return !!shell && shell.dataset.hidden !== "1";
        },
      };
    })();
  </script>
